<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101512">
<title>Last Circle — Battle Royale</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101512;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.panel{background:#101820d9;border:1px solid #ffffff28;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 4px 18px #0005}.brand{font-weight:900;letter-spacing:1.5px;font-size:14px}.small{font-size:11px;color:#c5d0d4}.stat{font-weight:800;font-size:15px}.health{width:150px;height:7px;background:#5a2020;border-radius:9px;overflow:hidden;margin-top:5px}.health>i{display:block;width:100%;height:100%;background:#61e294;transition:width .15s}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#fff9;text-shadow:0 2px 5px #000}.bottom{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}.controls{pointer-events:auto;display:flex;gap:10px;align-items:end}.stick{width:116px;height:116px;border-radius:50%;background:#c5d7e222;border:2px solid #ffffff55;position:relative;touch-action:none}.knob{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:#dce7edaa;border:2px solid #fff9}.buttons{display:grid;grid-template-columns:repeat(2,62px);gap:8px}.action{pointer-events:auto;width:62px;height:62px;border-radius:50%;border:1px solid #ffffff70;background:#122431dd;color:white;font-size:11px;font-weight:800;touch-action:none}.action.fire{background:#b42f2fdd}.action:active{transform:scale(.95)}#hint{position:absolute;left:50%;top:72px;transform:translateX(-50%);text-align:center;font-size:11px;color:#dce5e8;background:#101820bb;border-radius:10px;padding:7px 10px;white-space:nowrap}.desktop{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;color:#d5e0e4;background:#101820bb;padding:8px 12px;border-radius:10px;white-space:nowrap}#message{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,46px);font-weight:1000;text-align:center;text-shadow:0 4px 18px #000;display:none}#restart{pointer-events:auto;display:none;margin-top:12px;border:0;border-radius:10px;padding:12px 20px;font-weight:900;background:#d8f36a;color:#17200d}#damage{position:absolute;inset:0;border:0 solid #ff2020;pointer-events:none}#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.8}#cross:before,#cross:after{content:"";position:absolute;background:#fff;width:2px;height:18px;left:9px;top:1px}#cross:after{transform:rotate(90deg)}@media(min-width:800px){.mobileOnly{display:none}}@media(max-width:799px){.desktop{display:none}.bottom{bottom:12px}.stick{width:108px;height:108px}.knob{left:30px;top:30px}.panel{padding:8px 10px}.health{width:120px}}
</style></head>
<body><div id="hud"><div class="top"><div class="panel"><div class="brand">LAST CIRCLE <span style="color:#d8f36a">/ ROYALE</span></div><div class="small">SURVIVE. OUTPLAY. WIN.</div><div class="health"><i id="healthbar"></i></div><div class="small" id="healthtxt">HEALTH 100</div></div><div class="panel" style="text-align:right"><div class="small">ELIMINATIONS</div><div class="stat" id="kills">0</div><div class="small" id="alive">11 PLAYERS LEFT</div><div class="small" id="zone">ZONE 1 • SAFE</div></div></div><div id="hint">Drag screen to rotate camera · joystick to move · FIRE to shoot</div><div id="cross"></div><div class="center" id="hitmark" style="display:none;color:#ff6c6c">✕</div><div id="message">ELIMINATED<br><button id="restart">PLAY AGAIN</button></div><div id="damage"></div><div class="bottom mobileOnly"><div class="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div><div class="controls"><button class="action" id="aim">AIM</button><div class="buttons"><button class="action" id="jump">JUMP</button><button class="action fire" id="fire">FIRE</button><button class="action" id="sprint">SPRINT</button><button class="action" id="reload">RELOAD</button></div></div></div><div class="desktop" id="deskhelp">WASD move · drag mouse to look · click to fire · Shift sprint · Space jump</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb9c4);scene.fog=new THREE.Fog(0x9bb9c4,38,115);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f5ff,0x45523c,2.1));const sun=new THREE.DirectionalLight(0xfff1d5,2.3);sun.position.set(-22,35,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,rough=.82,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
const grass=mat(0x687d49),sand=mat(0xb5a27d),road=mat(0x444b4b),concrete=mat(0x858a86),dark=mat(0x1d2630),yellow=mat(0xffc928,.48),blue=mat(0x154dca,.48),black=mat(0x10151c),silver=mat(0xb7c2c8,.35,.5),skin=mat(0xb77d59),white=mat(0xe9e9df);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(190,190),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(180,60,0x526b43,0x526b43);grid.position.y=.015;scene.add(grid);
function box(parent,x,y,z,sx,sy,sz,material){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,x,y,z,r1,r2,h,material,segments=10){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function building(x,z,w,h,d,color){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(g,0,h/2,0,w,h,d,mat(color));box(g,0,h+.12,0,w+.5,.24,d+.5,dark);for(let yy=1.3;yy<h-0.2;yy+=1.7)for(let xx=-w/2+.65;xx<w/2-.3;xx+=1.5){const win=box(g,xx,yy,d/2+.015,.65,.75,.04,mat(Math.random()>.25?0x385b68:0x283b43,.3,.15));}box(g,0,.35,d/2+.12,1.4,.7,.2,mat(0x39413c));return g}
building(-13,-10,9,5,7,0x9b8e79);building(10,-15,10,8,8,0x8c9698);building(17,6,7,4,9,0xa78c70);building(-16,15,8,7,7,0x78888a);building(1,18,12,5,6,0x9a9a8b);building(-1,-24,14,6,7,0x8a887a);
for(let i=0;i<26;i++){const x=(Math.random()-.5)*88,z=(Math.random()-.5)*88;if(Math.abs(x)<23&&Math.abs(z)<24)continue;const h=1+Math.random()*3;box(scene,x,h/2,z,1.5+Math.random()*2,h,1.5+Math.random()*2,Math.random()>.5?concrete:sand)}
// road markings
box(scene,0,.025,0,7,.04,100,road);for(let z=-48;z<50;z+=7)box(scene,0,.05,z,.16,.025,3,mat(0xd9d7bc));
function makeFighter(kind=0,isPlayer=false){const g=new THREE.Group();const outfit=[mat(0x1d2738),mat(0x47614c),mat(0x793d30),mat(0x4e4d67),mat(0xc4bda6)][kind%5],accent=[mat(0xe85a45),mat(0xd1a64c),mat(0x43c6c8),mat(0x9b77dd),mat(0x2d3338)][kind%5];const skinTone=[0x956747,0xc18d65,0x754e3d,0xd2a07a,0x9a775a][kind%5];const sm=mat(skinTone);const torso=box(g,0,1.43,0,.72,.82,.38,isPlayer?blue:outfit);box(g,0,1.77,0,.76,.2,.4,isPlayer?yellow:accent);cylinder(g,0,2.04,0,.23,.25,.35,isPlayer?yellow:sm);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),isPlayer?yellow:sm);head.position.set(0,2.18,0);head.castShadow=true;g.add(head);if(isPlayer){box(g,0,2.18,-.01,.43,.12,.42,black);box(g,0,2.18,.22,.26,.055,.025,silver);for(const x of [-.19,.19]){const claw=new THREE.Mesh(new THREE.ConeGeometry(.045,.5,6),silver);claw.rotation.x=-Math.PI/2;claw.rotation.z=x<0?-.18:.18;claw.position.set(x,1.28,.48);g.add(claw)}box(g,0,1.02,0,.48,.18,.32,yellow)}else{const helmet=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8,0,Math.PI*2,0,Math.PI*.62),accent);helmet.position.y=2.25;helmet.castShadow=true;g.add(helmet);box(g,0,2.13,.18,.3,.1,.08,black)}
for(const x of [-.47,.47]){const arm=cylinder(g,x,1.42,0,.13,.16,.63,isPlayer?yellow:outfit);arm.rotation.z=x<0?-.12:.12;const glove=box(g,x*1.08,1.13,.05,.22,.2,.24,isPlayer?black:accent)}
for(const x of [-.2,.2]){cylinder(g,x,.58,0,.16,.19,.7,isPlayer?blue:outfit);box(g,x,.22,.09,.26,.18,.42,isPlayer?black:dark)}
const pack=box(g,0,1.45,-.25,.45,.53,.2,isPlayer?black:accent);g.userData={isPlayer,health:100,kind,alive:true,velocity:new THREE.Vector3(),fireWait:Math.random()*.8};g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
const player=makeFighter(0,true);player.position.set(0,0,7);scene.add(player);
const enemies=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=18+Math.random()*14;const e=makeFighter(i+1,false);e.position.set(Math.cos(a)*r,0,Math.sin(a)*r);e.rotation.y=Math.random()*Math.PI*2;scene.add(e);enemies.push(e)}
// Cover crates, barriers, rocks
for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,r=8+Math.random()*29;const x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<5&&Math.abs(z)<5)continue;const c=box(scene,x,.6,z,1.4+Math.random()*1.4,1.2,1.1+Math.random(),Math.random()>.5?mat(0x6a5744):mat(0x777b75));c.rotation.y=Math.random()*Math.PI}
const ring=new THREE.Mesh(new THREE.RingGeometry(27.7,28,96),new THREE.MeshBasicMaterial({color:0x8ee7ff,side:THREE.DoubleSide,transparent:true,opacity:.9}));ring.rotation.x=-Math.PI/2;ring.position.y=.08;scene.add(ring);
let zone=28,zoneTimer=40,health=100,kills=0,ammo=30,reloadTimer=0,gameOver=false,won=false,aiming=false,sprinting=false,jumping=false,vy=0,shotWait=0,lookYaw=0,lookPitch=.15,dragging=false,lastX=0,lastY=0,moveX=0,moveY=0,stickOn=false,fireHeld=false;const keys={};const clock=new THREE.Clock();const tempV=new THREE.Vector3();
function updateCamera(){const dist=aiming?4.2:6.5;const target=new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z);const horiz=Math.cos(lookPitch)*dist;camera.position.set(target.x+Math.sin(lookYaw)*horiz,target.y+Math.sin(lookPitch)*dist+1.0,target.z+Math.cos(lookYaw)*horiz);camera.lookAt(target.x,target.y+.25,target.z)}
function shoot(){if(gameOver||shotWait>0)return;if(ammo<=0){reload();return}ammo--;shotWait=.19;document.getElementById('hitmark').style.display='none';const origin=camera.position.clone(),dir=new THREE.Vector3();camera.getWorldDirection(dir);const ray=new THREE.Raycaster(origin,dir,0,55);const targets=enemies.filter(e=>e.userData.alive);let nearest=null,nearestD=999;for(const e of targets){const center=e.position.clone().add(new THREE.Vector3(0,1.2,0));const to=center.clone().sub(origin);const proj=to.dot(dir);if(proj<0||proj>55)continue;const closest=origin.clone().addScaledVector(dir,proj);if(closest.distanceTo(center)<.95&&proj<nearestD){nearest=e;nearestD=proj}}if(nearest){nearest.userData.health-=36;document.getElementById('hitmark').style.display='block';setTimeout(()=>document.getElementById('hitmark').style.display='none',130);if(nearest.userData.health<=0){nearest.userData.alive=false;scene.remove(nearest);kills++;document.getElementById('kills').textContent=kills;document.getElementById('alive').textContent=(enemies.filter(e=>e.userData.alive).length+1)+' PLAYERS LEFT';if(enemies.every(e=>!e.userData.alive))finish(true)}}}
function reload(){if(reloadTimer<=0&&ammo<30){reloadTimer=1.35;document.getElementById('reload').textContent='...';setTimeout(()=>{ammo=30;reloadTimer=0;document.getElementById('reload').textContent='RELOAD'},1350)}}
function finish(win){gameOver=true;won=win;document.getElementById('message').style.display='block';document.getElementById('message').firstChild.textContent=win?'VICTORY ROYALE':'ELIMINATED';document.getElementById('restart').style.display='inline-block'}
document.getElementById('restart').onclick=()=>location.reload();
const stick=document.getElementById('stick'),knob=document.getElementById('knob');function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34;const d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}moveX=dx/max;moveY=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}function resetStick(){stickOn=false;moveX=moveY=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{stickOn=true;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(stickOn)setStick(e)});stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.requestPointerLock?.()}else{dragging=true;lastX=e.clientX;lastY=e.clientY} });window.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.movementX??(e.clientX-lastX),dy=e.movementY??(e.clientY-lastY);lookYaw-=dx*.006;lookPitch=Math.max(-.35,Math.min(.72,lookPitch+dy*.004));lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>dragging=false);document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===renderer.domElement){dragging=true}else if(!('ontouchstart'in window))dragging=false});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){jumping=true;e.preventDefault()}if(e.code==='ShiftLeft')sprinting=true;if(e.code==='KeyR')reload();if(e.code==='KeyF')shoot()});window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ShiftLeft')sprinting=false});renderer.domElement.addEventListener('click',()=>{if(!('ontouchstart'in window))shoot()});
document.getElementById('fire').addEventListener('pointerdown',e=>{fireHeld=true;e.stopPropagation()});window.addEventListener('pointerup',()=>fireHeld=false);document.getElementById('aim').onclick=()=>aiming=!aiming;document.getElementById('sprint').onpointerdown=()=>sprinting=true;document.getElementById('sprint').onpointerup=()=>sprinting=false;document.getElementById('jump').onclick=()=>{if(player.position.y<.03){vy=6;jumping=true}};document.getElementById('reload').onclick=reload;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!gameOver){shotWait=Math.max(0,shotWait-dt);zoneTimer-=dt;if(zoneTimer<=0&&zone>10){zone=Math.max(10,zone-3);zoneTimer=30;ring.scale.setScalar(zone/28);document.getElementById('zone').textContent='ZONE '+Math.round(zone/3)+' • CLOSING'}const fwd=(keys.KeyW||keys.ArrowUp?-1:0)+(keys.KeyS||keys.ArrowDown?1:0)+moveY;const side=(keys.KeyD||keys.ArrowRight?1:0)+(keys.KeyA||keys.ArrowLeft?-1:0)+moveX;const speed=(sprinting||keys.ShiftLeft?9:5.5);const dx=(Math.sin(lookYaw)*(-fwd)+Math.cos(lookYaw)*side)*speed*dt,dz=(Math.cos(lookYaw)*(-fwd)-Math.sin(lookYaw)*side)*speed*dt;player.position.x+=dx;player.position.z+=dz;player.position.x=Math.max(-83,Math.min(83,player.position.x));player.position.z=Math.max(-83,Math.min(83,player.position.z));if(Math.abs(fwd)+Math.abs(side)>.1)player.rotation.y=Math.atan2(dx,dz);if(jumping||player.position.y>.001){vy-=15*dt;player.position.y=Math.max(0,player.position.y+vy*dt);if(player.position.y===0){vy=0;jumping=false}}if(fireHeld)shoot();if(reloadTimer>0)reloadTimer=Math.max(0,reloadTimer-dt);
for(const e of enemies){if(!e.userData.alive)continue;e.userData.fireWait-=dt;const to=player.position.clone().sub(e.position),dist=to.length();if(dist>4){to.normalize();const pace=dist>18?2.1:1.2;e.position.addScaledVector(to,pace*dt);e.rotation.y=Math.atan2(to.x,to.z)}else e.rotation.y=Math.atan2(to.x,to.z);if(dist<22&&e.userData.fireWait<=0){e.userData.fireWait=1.0+Math.random()*1.4;if(Math.random()<.38){health=Math.max(0,health-(2+Math.random()*5));document.getElementById('damage').style.border='12px solid #ff202055';setTimeout(()=>document.getElementById('damage').style.border='0 solid transparent',120);if(health<=0)finish(false)}}}
if(Math.hypot(player.position.x,player.position.z)>zone){health=Math.max(0,health-5*dt);if(health<=0)finish(false)}document.getElementById('healthbar').style.width=health+'%';document.getElementById('healthtxt').textContent='HEALTH '+Math.ceil(health)+'  •  AMMO '+ammo;document.getElementById('alive').textContent=(enemies.filter(e=>e.userData.alive).length+1)+' PLAYERS LEFT';updateCamera()}
renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
